<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luau Decompiler Tester</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Luau Decompiler Tester</h1>
      <p class="subtitle">Сравнение декомпиляторов на реальных скриптах из официальных репозиториев</p>
    </header>

    <section class="panel">
      <h2>Декомпиляторы</h2>
      <form id="add-decompiler-form">
        <input type="text" id="dec-name" placeholder="Название" required>
        <input type="url" id="dec-url" placeholder="URL API (например, https://host/decompile)" required>
        <select id="dec-method">
          <option value="POST">POST</option>
          <option value="GET">GET</option>
        </select>
        <input type="text" id="dec-headers" placeholder='Заголовки (JSON, опционально)'>
        <input type="text" id="dec-body" placeholder='Шаблон тела: {"code":"__BYTECODE__"}'>
        <button type="submit">Добавить</button>
      </form>
      <ul id="decompiler-list"></ul>
    </section>

    <section class="panel">
      <h2>Запустить тест</h2>
      <select id="test-repo"></select>
      <select id="test-decompiler"></select>
      <select id="test-difficulty">
        <option value="easy">Лёгкий — 50</option>
        <option value="normal">Нормальный — 125</option>
        <option value="hard">Сложный — 355</option>
      </select>
      <button id="run-test">Запустить</button>
      <button id="run-selftest" type="button" style="background:#6e6e73;">Самодиагностика</button>
      <div id="status"></div>
    </section>

    <section class="panel">
      <h2>График результатов</h2>
      <div id="chart-wrap">
        <svg id="chart" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid meet"></svg>
        <div id="tooltip"></div>
      </div>
    </section>

    <section class="panel">
      <h2>Последние результаты</h2>
      <div id="results-container"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
